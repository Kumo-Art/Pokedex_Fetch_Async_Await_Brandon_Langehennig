<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Pokédex Fetch</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <img class="h-100 w-400 object-fill" src="/assets/images.jpg">
    <h1 class="flex justify-center text-4xl font-bold mt-20">Pokédex</h1>

    <form id="search-form" class="flex justify-center mt-4">
        <input id="search-input" placeholder="Name or ID (e.g. pikachu, 25)" />
        <button type="submit" class="ml-2">Search</button>
    </form>

    <p id="status"></p>
    <div id="pokemon-card" class="pokemon-card" hidden>
        <img id="card-image" class="card-image" alt="" width="120" height="120">
        <h2 id="card-id"></h2>
        <p id="card-name" class="card-login"></p>
        <p id="card-height" class="card-login"></p>
        <p id="card-weight" class="card-bio"></p>
        <p id="card-types" class="card-login"></p>
        <p id="card-abilities" class="card-bio"></p>
        <p id="card-stats" class="card-login"></p>
        <img id="form-image" class="form-image" hidden>
    </div>
    <div class="flex justify-center m-20">
        <button id="fuse-btn">Fusions</button>
    </div>
   
    <script src="app.js"></script>
</body>

</html>
